# Hooks run out of the project venv, so they are the same tool versions that
# `make gates` and CI use. Activate the venv before committing:
#
#     . ~/.venvs/autofill-audit/bin/activate
#     pre-commit install --install-hooks
#     pre-commit install --hook-type commit-msg
#
# Every hook is `language: system` on purpose. Letting pre-commit build its own
# isolated environments would give the hooks a second, silently drifting copy of
# ruff and mypy, and the first time it drifted the pre-commit result and the CI
# result would disagree with no visible cause.

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy strict
        entry: mypy --strict src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
        require_serial: true

      - id: check-dashes
        name: no em dashes or en dashes
        entry: python scripts/check_dashes.py
        language: system
        require_serial: true
        exclude: ^\.git/

      - id: check-commit-msg
        name: commit message is clean
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Two directories are over the hook's default ceiling by design.
        #
        # models/ holds the ONNX file, a weight matrix over the whole feature
        # vocabulary. Ground rule 8 requires it to be committed with its card,
        # spec section 18 requires its sha to identify every run that used it,
        # and neither is possible if the file is not in the repository.
        #
        # experiments/results/ holds run logs, one JSON object per classified
        # field, and spec section 13.1 puts the engine's identity and the corpus
        # sha on every row so that a log separated from its manifest still says
        # what produced it. That repetition is most of the size and it is the
        # point of the schema. Law 3's chain ends at a committed file, so a
        # result too large to commit is a result nothing may cite, and the
        # directory is append-only history rather than a working area: a wrong
        # result gets a new run id and the old one stays.
        #
        # report/ and report_debug/ hold the compiled PDFs of spec section 17.
        # They are deliverables rather than build output, and spec section 17.1
        # requires them to be committed so that a reader arriving from a clone
        # does not need a LaTeX toolchain to read the write-up. Their sources,
        # their generated tables and their generated figures are all here too,
        # so the PDF is reproducible rather than opaque; it is committed because
        # requiring a multi-gigabyte typesetting installation to read a report
        # is a worse trade than half a megabyte in the repository. The size is
        # not padding: it is embedded font subsets and six vector figures.
        exclude: ^(models|experiments/results|report|report_debug)/
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        # The golden report snapshots are byte-exact copies of what the tool
        # prints, and rich pads a table row out to the full terminal width. A
        # hook that trimmed those trailing spaces would rewrite the committed
        # expectation on every commit and the snapshot suite would fail against
        # its own repository. The exemption is narrow, is only for this
        # directory, and is the reason the directory exists.
        exclude: ^tests/golden/
