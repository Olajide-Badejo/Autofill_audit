<!doctype html>
<!--
  Tests: a form with no label element anywhere, no aria-label, no placeholder,
  and no declared autocomplete. The only signals are identifiers and position.

  What it proves:
    - all three selector preferences fire on one page: an id that is usable, a
      name inside a named form when the id is generated looking, and a
      positional path when there is neither
    - an id with a long hex run is rejected by looks_generated even though it
      is present and unique, which is the case an extractor that only checked
      for the presence of an id would get wrong
    - label_source is None rather than the empty string when nothing labels a
      control
  Hand authored. Not a copy of any live site.
-->
