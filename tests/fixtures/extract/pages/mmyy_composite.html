<!doctype html>
<!--
  Tests: one text input collecting what the specification splits, the classic
  MM/YY expiry box.

  What it proves, and it proves it by absence: the extractor invents NO group
  here. There is one control, so there is nothing to pair, and spec section 9.5
  is explicit that a group the extractor invents becomes one wrong finding.
  Naming this control COMPOSITE_UNSPLIT is a judgement about meaning and belongs
  to the classifier at P3; all the extractor owes it is the evidence, which is
  the maxlength of five, the pattern, and the placeholder.
  Hand authored. Not a copy of any live site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
</head>
<body>
<main>
<h1>Card</h1>
<form name="pay" method="post" action="#">
<div class="field">
<label for="pay-number">Card number</label>
<input id="pay-number" name="pay_number" type="text" inputmode="numeric" maxlength="19" autocomplete="cc-number">
</div>
<div class="field">
<label for="pay-expiry">Expiry</label>
<input id="pay-expiry" name="pay_expiry" type="text" inputmode="numeric" maxlength="5" pattern="[0-9]{2}/[0-9]{2}" placeholder="MM/YY">
</div>
</form>
</main>
</body>
</html>
