<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Checkout</h1>
<aside class="summary">
<h2>Order summary</h2>
<p>Delivering to: Kimberly Allen</p>
<p>7344 Ibarra Loop Suite 535, Allisontown 03756, United States</p>
<p>We will contact you on: (555) 0152</p>
</aside>
<form name="f1" method="post" action="#">
<section id="sec-contact" class="block">
<h2>Contact details</h2>
<div class="row">
<div class="field">
<label for="contact-fullname">Full name</label>
<input id="contact-fullname" name="contact_fullname" type="text" autocomplete="name" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="contact-email">Email address</label>
<input id="contact-email" name="contact_email" type="email" inputmode="email" placeholder="you@example.com">


</div>
</div>
<div class="row">
<div class="field">
<label for="contact-phonecc">Country code</label>
<select id="contact-phonecc" name="contact_phonecc" autocomplete="tel-country-code">
<option value=""></option>
<option value="+1">United States (+1)</option>
<option value="+44">United Kingdom (+44)</option>
<option value="+49">Germany (+49)</option>
<option value="+33">France (+33)</option>
<option value="+81">Japan (+81)</option>
<option value="+234">Nigeria (+234)</option>
</select>


</div>
</div>
<div class="row">
<div class="field">
<label for="contact-phonenumber">Phone number</label>
<input id="contact-phonenumber" name="contact_phonenumber" type="tel" inputmode="tel" placeholder="(555) 0123">


</div>
</div>
<div class="row">
<div class="field">
<label for="contact-phoneext">Ext.</label>
<input id="contact-phoneext" name="contact_phoneext" type="text" inputmode="numeric" maxlength="6" autocomplete="tel-extension" placeholder="1234">


</div>
</div>
</section>
<div class="block">
<h2>S</h2>
<div class="row">
<div class="field">
<input type="text" placeholder="123 Example Street">


</div>
</div>
<div class="row">
<div class="field">
<input name="ctl00$txt7" type="text">


</div>
</div>
<div class="row">
<div class="field">
<af-field id="ce-1" data-tag="input" data-type="text" data-name="ctl00$txt8" data-placeholder="Springfield"></af-field>
</div>
</div>
<div class="row">
<div class="field">
<select id="input9">
<option value=""></option>
<option value="California">California</option>
<option value="New York">New York</option>
<option value="Texas">Texas</option>
<option value="Illinois">Illinois</option>
<option value="Washington">Washington</option>
<option value="Oregon">Oregon</option>
</select>


</div>
</div>
<div class="row">
<div class="field">
<input id="field_10" name="field_10" type="text" placeholder="01234">


</div>
</div>
<div class="row">
<div class="field">
<select id="field_11" name="field_11">
<option value=""></option>
<option value="US">United States</option>
<option value="CA">Canada</option>
<option value="GB">United Kingdom</option>
<option value="DE">Germany</option>
<option value="FR">France</option>
<option value="JP">Japan</option>
<option value="NG">Nigeria</option>
</select>


</div>
</div>
<div class="row">
<div class="field">
<input id="input17" type="text">


</div>
</div>
<div class="row">
<div class="field">
<canvas id="canvas-shipping" width="320" height="120"></canvas>
<p class="canvas-note">Card number</p>
</div>
</div>
<div class="row">
<div class="field" id="inj-slot-18">
</div>
</div>
</div>
<section id="sec-payment" class="block">
<h2>Payment</h2>
<div class="row">
<div class="field">
<label for="payment-cardholder">Name on card</label>
<input id="payment-cardholder" name="payment_cardholder" type="text" autocomplete="cc-name">


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-cardnumber">Card number</label>
<input id="payment-cardnumber" name="payment_cardnumber" type="text" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="4242 4242 4242 4242">


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-cardexpiry">Expiration date</label>
<input id="payment-cardexpiry" name="payment_cardexpiry" type="month" autocomplete="cc-exp" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-securitycode">Security code</label>
<input id="payment-securitycode" name="payment_securitycode" type="text" inputmode="numeric" maxlength="4" autocomplete="cc-csc" placeholder="123">


</div>
</div>
</section>
<section id="sec-extras" class="block">
<h2>Additional information</h2>
<div class="row">
<div class="field">
<input id="extras-termsaccepted" name="extras_termsaccepted" type="checkbox">

<label for="extras-termsaccepted">I accept the terms of sale</label>

</div>
</div>
</section>
<div class="actions"><button type="submit">Checkout</button></div>
</form>
</main>
<script>
class AfField extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) { return; }
    var root = this.attachShadow({ mode: 'open' });
    var el = document.createElement(this.dataset.tag || 'input');
    if (this.dataset.type) { el.setAttribute('type', this.dataset.type); }
    if (this.dataset.name) { el.setAttribute('name', this.dataset.name); }
    if (this.dataset.placeholder) { el.setAttribute('placeholder', this.dataset.placeholder); }
    root.appendChild(el);
  }
}
customElements.define('af-field', AfField);
</script>
<script>
window.setTimeout(function () {
  var slot1 = document.getElementById("inj-slot-18");
  if (slot1) {
    var el1 = document.createElement('input');
    el1.setAttribute('type', "text");
    el1.setAttribute('id', "input18");
    el1.setAttribute('name', "field_18");
    el1.setAttribute('placeholder', "EXAMPLE10");
    slot1.appendChild(el1);
  }
}, 300);
</script>
</body>
</html>
