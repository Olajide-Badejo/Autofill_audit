<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment details</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Payment details</h1>
<form name="payment" method="post" action="#">
<section id="sec-payment" class="block">
<h2>Payment</h2>
<div class="row">
<div class="field">
<label for="payment-cardholder">Name on card</label>
<input id="payment-cardholder" name="payment_cardholder" type="text" autocomplete="cc-name">


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-cardnumber">Card number</label>
<input id="payment-cardnumber" name="payment_cardnumber" type="text" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="4242 4242 4242 4242" required>


</div>
</div>
</section>
<section id="sec-security" class="block">
<h2>Security</h2>
<fieldset>
<legend>Expiration date</legend>
<div class="row">
<div class="field">
<label for="security-expmonth">Month</label>
<select id="security-expmonth" name="security_expmonth" autocomplete="cc-exp-month">
<option value="01">01</option>
<option value="02">02</option>
<option value="03">03</option>
<option value="04">04</option>
<option value="05">05</option>
<option value="06">06</option>
<option value="07">07</option>
<option value="08">08</option>
<option value="09">09</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
</select>


</div>
<div class="field">
<label for="security-expyear">Year</label>
<select id="security-expyear" name="security_expyear" autocomplete="cc-exp-year" required>
<option value="2026">2026</option>
<option value="2027">2027</option>
<option value="2028">2028</option>
<option value="2029">2029</option>
<option value="2030">2030</option>
<option value="2031">2031</option>
<option value="2032">2032</option>
<option value="2033">2033</option>
<option value="2034">2034</option>
<option value="2035">2035</option>
<option value="2036">2036</option>
</select>


</div>
</div>
</fieldset>
<div class="row">
<div class="field">
<label for="security-securitycode">Security code</label>
<input id="security-securitycode" name="security_securitycode" type="text" inputmode="numeric" maxlength="4" autocomplete="cc-csc" placeholder="123" required>


</div>
</div>
</section>
<div class="actions"><button type="submit">Payment details</button></div>
</form>
</main>
</body>
</html>
