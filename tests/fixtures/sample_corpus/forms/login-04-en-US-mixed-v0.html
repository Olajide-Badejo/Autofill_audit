<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Sign in</h1>
<form name="f1" method="post" action="#">
<section id="sec-account" class="block">
<h2>Account</h2>
<div class="row">
<div class="field">
<label for="account-email">Email address</label>
<input id="account-email" name="account_email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>


</div>
</div>
</section>
<div class="block">
<h2>S</h2>
<div class="row">
<div class="field">
<input type="text" placeholder="123456">


</div>
</div>
<div class="row">
<div class="field">
<input id="input3" type="text">


</div>
</div>
<div class="row">
<div class="field" id="inj-slot-4">
</div>
</div>
</div>
<div class="actions"><button type="submit">Sign in</button></div>
</form>
</main>
<script>
window.setTimeout(function () {
  var slot1 = document.getElementById("inj-slot-4");
  if (slot1) {
    var el1 = document.createElement('input');
    el1.setAttribute('type', "text");
    el1.setAttribute('id', "input4");
    el1.setAttribute('name', "field_4");
    el1.setAttribute('placeholder', "Search the store");
    slot1.appendChild(el1);
  }
}, 300);
</script>
</body>
</html>
