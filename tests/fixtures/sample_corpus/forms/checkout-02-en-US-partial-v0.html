<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Checkout</h1>
<aside class="summary">
<h2>Order summary</h2>
<p>Delivering to: Daisy Murphy</p>
<p>1499 Hall Summit, Kiddville 06330, United States</p>
<p>We will contact you on: (555) 0199</p>
</aside>
<form name="checkout" method="post" action="#">
<section id="sec-contact" class="block">
<h2>Contact details</h2>
<div class="row">
<div class="field">
<label for="contact-email">Email address</label>
<input id="contact-email" name="contact_email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>


</div>
</div>
</section>
<section id="sec-shipping" class="block">
<h2>Shipping address</h2>
<div class="row">
<div class="field">
<label for="shipping-street">Street address</label>
<input id="shipping-street" name="shipping_street" type="text" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="shipping-city">City</label>
<input id="shipping-city" name="shipping_city" type="text" autocomplete="shipping address-level2" placeholder="Springfield">


</div>
<div class="field">
<label for="shipping-state">State</label>
<select id="shipping-state" name="shipping_state">
<option value=""></option>
<option value="California">California</option>
<option value="New York">New York</option>
<option value="Texas">Texas</option>
<option value="Illinois">Illinois</option>
<option value="Washington">Washington</option>
<option value="Oregon">Oregon</option>
</select>


</div>
<div class="field">
<label for="shipping-zip">ZIP code</label>
<input id="shipping-zip" name="shipping_zip" type="text" inputmode="numeric" maxlength="10" autocomplete="shipping postal-code" placeholder="01234" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="shipping-country">Country</label>
<select id="shipping-country" name="shipping_country" autocomplete="shipping country" required>
<option value=""></option>
<option value="US">United States</option>
<option value="CA">Canada</option>
<option value="GB">United Kingdom</option>
<option value="DE">Germany</option>
<option value="FR">France</option>
<option value="JP">Japan</option>
<option value="NG">Nigeria</option>
</select>


</div>
</div>
</section>
<section id="sec-payment" class="block">
<h2>Payment</h2>
<div class="row">
<div class="field">
<label for="payment-cardtype">Card type</label>
<select id="payment-cardtype" name="payment_cardtype" autocomplete="cc-type" required>
<option value=""></option>
<option value="visa">Visa</option>
<option value="mastercard">Mastercard</option>
<option value="americanexpress">American Express</option>
<option value="discover">Discover</option>
</select>


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-cardholder">Name on card</label>
<input id="payment-cardholder" name="payment_cardholder" type="text" autocomplete="cc-name" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="payment-cardnumber">Card number</label>
<input id="payment-cardnumber" name="payment_cardnumber" type="text" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="4242 4242 4242 4242" required>


</div>
</div>
<fieldset>
<legend>Expiration date</legend>
<div class="row">
<div class="field">
<label for="payment-expmonth">Month</label>
<select id="payment-expmonth" name="payment_expmonth" autocomplete="cc-exp-month">
<option value="01">01</option>
<option value="02">02</option>
<option value="03">03</option>
<option value="04">04</option>
<option value="05">05</option>
<option value="06">06</option>
<option value="07">07</option>
<option value="08">08</option>
<option value="09">09</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
</select>


</div>
<div class="field">
<label for="payment-expyear">Year</label>
<select id="payment-expyear" name="payment_expyear" autocomplete="cc-exp-year">
<option value="2026">2026</option>
<option value="2027">2027</option>
<option value="2028">2028</option>
<option value="2029">2029</option>
<option value="2030">2030</option>
<option value="2031">2031</option>
<option value="2032">2032</option>
<option value="2033">2033</option>
<option value="2034">2034</option>
<option value="2035">2035</option>
<option value="2036">2036</option>
</select>


</div>
</div>
</fieldset>
<div class="row">
<div class="field">
<label for="payment-securitycode">Security code</label>
<input id="payment-securitycode" name="payment_securitycode" type="text" inputmode="numeric" maxlength="4" placeholder="123" required>


</div>
</div>
</section>
<section id="sec-order" class="block">
<h2>Order</h2>
<div class="row">
<div class="field">
<label for="order-quantity">Quantity</label>
<input id="order-quantity" name="order_quantity" type="number" inputmode="numeric">


</div>
</div>
<div class="row">
<div class="field">
<label for="order-promocode">Promo code</label>
<input id="order-promocode" name="order_promocode" type="text" maxlength="16" placeholder="EXAMPLE10" required>


</div>
</div>
</section>
<div class="actions"><button type="submit">Checkout</button></div>
</form>
</main>
</body>
</html>
