<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Address book</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Address book</h1>
<aside class="summary">
<h2>Order summary</h2>
<p>Delivering to: Nicholas Cisneros</p>
<p>531 Shannon River, Port Lisabury 01727, United States</p>
<p>We will contact you on: (555) 0118</p>
</aside>
<form name="f1" method="post" action="#">
<section id="sec-identity" class="block">
<h2>Your details</h2>
<div class="row">
<div class="field">
<label for="identity-fullname">Full name</label>
<input id="identity-fullname" name="identity_fullname" type="text" autocomplete="name">


</div>
</div>
</section>
<div class="block">
<h2>A</h2>
<div class="row">
<div class="field">
<textarea placeholder="Street, city, state, ZIP code" rows="3"></textarea>


</div>
</div>
<div class="row">
<div class="field">
<select name="ctl00$txt3">
<option value=""></option>
<option value="US">United States</option>
<option value="CA">Canada</option>
<option value="GB">United Kingdom</option>
<option value="DE">Germany</option>
<option value="FR">France</option>
<option value="JP">Japan</option>
<option value="NG">Nigeria</option>
</select>


</div>
</div>
<div class="row">
<div class="field">
<input id="input5" type="text">


</div>
</div>
<div class="row">
<div class="field" id="inj-slot-6">
</div>
</div>
</div>
<section id="sec-contact" class="block">
<h2>Contact details</h2>
<div class="row">
<div class="field">
<label for="contact-phone">Phone number</label>
<input id="contact-phone" name="contact_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 0123" required>


</div>
</div>
</section>
<div class="actions"><button type="submit">Address book</button></div>
</form>
</main>
<script>
window.setTimeout(function () {
  var slot1 = document.getElementById("inj-slot-6");
  if (slot1) {
    var el1 = document.createElement('input');
    el1.setAttribute('type', "text");
    el1.setAttribute('id', "input6");
    el1.setAttribute('name', "field_6");
    el1.setAttribute('placeholder', "Search the store");
    slot1.appendChild(el1);
  }
}, 300);
</script>
</body>
</html>
