<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
main { max-width: 44rem; margin: 0 auto; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.field { display: flex; flex-direction: column; flex: 1 1 12rem; margin-bottom: 0.75rem; }
label { font-size: 0.85rem; margin-bottom: 0.25rem; }
input, select, textarea { font: inherit; padding: 0.4rem; }
fieldset { border: 1px solid #ccc; margin: 0 0 0.75rem; }
.summary { background: #f4f4f4; padding: 0.75rem; margin-bottom: 1rem; }
.canvas-note { font-size: 0.8rem; color: #555; }
</style>
</head>
<body>
<main>
<h1>Create an account</h1>
<form name="signup" method="post" action="#">
<section id="sec-identity" class="block">
<h2>Your details</h2>
<div class="row">
<div class="field">
<label for="identity-firstname">First name</label>
<input id="identity-firstname" name="identity_firstname" type="text" autocomplete="given-name">


</div>
</div>
<div class="row">
<div class="field">
<label for="identity-lastname">Last name</label>
<input id="identity-lastname" name="identity_lastname" type="text" autocomplete="family-name">


</div>
</div>
<div class="row">
<div class="field">
<label for="identity-email">Email address</label>
<input id="identity-email" name="identity_email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">


</div>
</div>
</section>
<section id="sec-account" class="block">
<h2>Account</h2>
<div class="row">
<div class="field">
<label for="account-username">Username</label>
<input id="account-username" name="account_username" type="text" autocomplete="username" required>


</div>
</div>
<div class="row">
<div class="field">
<label for="account-newpassword">Password</label>
<input id="account-newpassword" name="account_newpassword" type="password" autocomplete="new-password">


</div>
</div>
<div class="row">
<div class="field">
<label for="account-confirmpassword">Confirm password</label>
<input id="account-confirmpassword" name="account_confirmpassword" type="password" autocomplete="new-password" required>


</div>
</div>
</section>
<section id="sec-extras" class="block">
<h2>Additional information</h2>
<div class="row">
<div class="field">
<input id="extras-termsaccepted" name="extras_termsaccepted" type="checkbox" required>

<label for="extras-termsaccepted">I accept the terms of sale</label>

</div>
</div>
</section>
<div class="actions"><button type="submit">Create an account</button></div>
</form>
</main>
</body>
</html>
