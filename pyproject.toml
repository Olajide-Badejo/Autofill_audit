[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofill-audit"
dynamic = ["version"]
description = "Audit HTML forms for browser autofill readiness."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olajide Badejo" }]
keywords = [
    "autofill",
    "web-forms",
    "accessibility",
    "playwright",
    "onnx",
    "machine-learning",
    "developer-tools",
    "html",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]

# Lower bounds are the versions resolved on the build machine at P0 and recorded
# in docs/adr/0001-toolchain-resolution.md. The exact pin set lives in
# requirements.lock, which CI installs from.
dependencies = [
    "click>=8.4.2",
    "faker>=40.37.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "playwright>=1.62.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
llm = [
    "httpx>=0.28.1",
]
dev = [
    "build>=1.5.0",
    "hypothesis>=6.165.10",
    # The external evaluation harness (spec section 0.5). Pinned to a git tag
    # because it exists only as a GitHub release. Spec section 0.5 permits a git
    # ref at P5 and forbids one at the 1.0.0 tag, and the publication task is in
    # docs/cross-repo-tasks.md.
    #
    # It sits in the dev extra rather than in the runtime dependencies, and the
    # reason is a measurement rather than a preference. Installing it pulls
    # thirteen transitive packages, tensorboard, grpcio, pandas, plotly, pillow
    # and werkzeug among them, because its ingestion layer reads TensorBoard
    # event files and its reports draw plots. This project uses two statistics
    # functions and one parser probe. A `pipx install autofill-audit` that
    # dragged a training-metrics logging stack onto a developer's machine so that
    # a command they will never run could compute a permutation p value would be
    # the wrong trade, and the audit path never imports it. The narrower extra
    # this wants is proposed in docs/cross-repo-tasks.md.
    "ml-experiment-triage @ git+https://github.com/Olajide-Badejo/ML-Experiment-Triage@v1.0.0",
    # Figure generation for the P7 reports. It is a development dependency for
    # the same reason the evaluation harness is one: `scripts/make_report_figures.py`
    # runs from a checkout to produce committed PDFs, the audit path never
    # imports it, and a plotting stack has no business in a `pipx` install of a
    # command line auditor.
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "pip-tools>=7.6.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "skl2onnx>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/Olajide-Badejo/autofill-audit"
Repository = "https://github.com/Olajide-Badejo/autofill-audit"
Changelog = "https://github.com/Olajide-Badejo/autofill-audit/blob/main/CHANGELOG.md"

[project.scripts]
autofill-audit = "autofill_audit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "autofill_audit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The locale tables, the Jinja fragments, and the answer-key schema are data the
# generator reads at runtime, so they have to travel in the wheel. `corpus
# generate` is part of the shipped command surface, and a wheel that omitted
# them would install a command that cannot run.
autofill_audit = [
    "py.typed",
    # The decision thresholds of spec section 11.3, loaded at runtime rather than
    # hardcoded (law 1's "never a folklore constant"). A wheel without them
    # installs a tool that cannot decide whether to report anything.
    "audit/*.json",
    "corpus/locales/*.json",
    "corpus/templates/*.j2",
    "corpus/*.json",
    # The in-page traversal of spec section 9.1. It is a JavaScript file rather
    # than a Python string so that it can be edited as JavaScript, and that
    # means it has to travel in the wheel or the installed extractor has
    # nothing to inject.
    "extract/*.js",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.14"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# The external evaluation harness ships no `py.typed` marker, so `mypy --strict`
# refuses to look inside it and every value that crosses the boundary arrives as
# `Any`. That is a real cost of the boundary and it is recorded as such: the
# consequence is that `evaluate/triage_bridge.py` is the one module in `src/`
# whose external calls are unchecked, which is another reason for it to be the
# only module that makes them. The fix belongs in that repository, is a one line
# packaging change, and is in docs/cross-repo-tasks.md. This override is a
# configuration of this project's checker, not a change to the dependency.
[[tool.mypy.overrides]]
module = ["triage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/autofill_audit --cov-report=term-missing --cov-fail-under=90"
markers = [
    "e2e: end to end tests that drive a real browser against local fixtures",
    "llm: tests that need a reachable local LLM; skipped unless AUTOFILL_AUDIT_LLM_TESTS=1",
    # Law 2 clause (d): every taxonomy label must be asserted by at least one
    # test. The marker carries the label, scripts/check_reachability.py collects
    # the markers, and a label nothing asserts fails the build.
    "label(name): this test asserts an outcome that depends on one taxonomy label",
]

[tool.coverage.run]
source = ["src/autofill_audit"]
branch = true

[tool.coverage.report]
show_missing = true
