name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # CI installs the exact pin set, never a fresh resolution. A build that
  # resolves its own dependencies is a build that can go red for a reason that
  # has nothing to do with the commit under test.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: no em dashes or en dashes
        run: python scripts/check_dashes.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: mypy strict
        run: python -m mypy --strict src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          version="$(sed -n 's/^playwright==\([0-9][^ ;]*\).*/\1/p' requirements.lock | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The browser cache key must carry the Playwright version. Playwright pins
      # a browser build per release, and a stale cache fails at launch with an
      # error that reads like an unrelated problem.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: python -m playwright install chromium --with-deps
      - name: pytest
        run: >
          python -m pytest -q
          --cov=src/autofill_audit
          --cov-report=term-missing
          --cov-fail-under=90

  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: check_reachability
        run: python scripts/check_reachability.py

  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Law 3's chain ends at a commit, and --resolve asks this repository to
          # produce the object each manifest names. A shallow clone holds only
          # the tip, so every citation of a run taken in an earlier commit fails
          # with a message about a commit that does not resolve, which is true of
          # the clone and false of the repository. The whole history is the input.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      # --resolve walks law 3's chain the whole way: every citation in the README
      # and in docs/ must name a result file that exists, whose manifest names a
      # commit this repository can produce. A check that only matched the shape
      # of a citation would pass a citation of a file nobody committed.
      - name: check_traceability
        run: python scripts/check_traceability.py --resolve

  ancestry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Law 4's check asks whether one commit is an ancestor of another, and
          # a shallow clone cannot answer that. The whole history is the input.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: check_prediction_ancestry
        run: python scripts/check_prediction_ancestry.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
      - name: Build wheel and sdist
        run: python -m build
      # A separate step with a pipx environment of its own, so the wheel is
      # exercised the way a user installs it rather than through the checkout
      # that built it. PIPX_HOME and PIPX_BIN_DIR are set explicitly rather than
      # left to default, both so the environment is genuinely clean and so the
      # installed console script is at a known path instead of one this job has
      # to guess.
      - name: Install the wheel with pipx and run it
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx-home
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          python -m pip install --user pipx
          python -m pipx install --python "${{ env.pythonLocation }}/bin/python" dist/*.whl
          "$PIPX_BIN_DIR/autofill-audit" version
          "$PIPX_BIN_DIR/autofill-audit" --version
          "$PIPX_BIN_DIR/autofill-audit" audit --help
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
